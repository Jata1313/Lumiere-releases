name: 💡 Idea or wish
description: Suggest something that would make Lumière more useful.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Lumière to do, and why would it help you?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Lumière stays **offline, private and AI-free** by design, so ideas that keep it that way have the best chance.
